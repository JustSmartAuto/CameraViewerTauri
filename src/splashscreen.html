<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Splash</title>
    <!--
      Tauri 官方启动画面方式（https://tauri.org.cn/v1/guides/features/splashscreen/ 的 Tauri 2 适配版）：
      独立 splashscreen 窗口加载本页面；主窗口配置 visible:false，
      主界面初始化完成后由 main.js 调用 close_splashscreen 命令关闭本窗口并显示主窗口。
      本页面完全自包含（内联 CSS/JS/内联 SVG），不引用任何外部资源。
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1b1f;
        color: #e8e8ec;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        user-select: none;
      }
      .splash-box {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        margin-bottom: 18px;
        animation: splash-pop 0.5s ease;
      }
      .splash-name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 1px;
        margin-bottom: 24px;
      }
      .splash-bar {
        position: relative;
        width: 220px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      .splash-bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(0, 120, 212, 0), #4a9fe0, rgba(0, 120, 212, 0));
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      .splash-meta {
        margin-top: 14px;
        width: 220px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #9a9aa4;
      }
      #splash-elapsed {
        font-variant-numeric: tabular-nums;
        color: #b8cde6;
      }
      @keyframes splash-slide {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(360%); }
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.86); }
        to   { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="splash-box">
      <svg class="splash-logo" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="8" y="18" width="56" height="42" rx="6" stroke="#4a9fe0" stroke-width="3.5"/>
        <path d="M26 18l4-7h12l4 7" stroke="#4a9fe0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="36" cy="39" r="11" stroke="#9cc8f0" stroke-width="3.5"/>
        <circle cx="36" cy="39" r="4" fill="#4a9fe0"/>
        <circle cx="55.5" cy="26.5" r="2.2" fill="#9cc8f0"/>
      </svg>
      <div class="splash-name">CameraViewerTauri</div>
      <div class="splash-bar"></div>
      <div class="splash-meta">
        <span>正在启动… / Loading…</span>
        <span id="splash-elapsed">0 ms</span>
      </div>
    </div>
    <script>
      // 从本窗口文档开始加载即计时，毫秒数实时刷新
      (function () {
        var start = performance.now();
        setInterval(function () {
          var el = document.getElementById("splash-elapsed");
          if (el) {
            el.textContent = Math.round(performance.now() - start).toLocaleString("en-US") + " ms";
          }
        }, 33);
      })();
    </script>
  </body>
</html>
