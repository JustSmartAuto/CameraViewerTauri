[project]
name = "camera-cell-monitor"
version = "0.1.0"
description = "Cognex In-Sight 单元格数据监控器（CogSocket 订阅 + SQLite/xlsx 落库 + 趋势图表）"
requires-python = ">=3.13"
dependencies = [
    "websockets>=15",
    "openpyxl>=3.1",
    "matplotlib>=3.10",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[project.scripts]
cell-monitor = "cellmonitor.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
