[project]
name = "data-router-py"
version = "26.11.4.1"
description = "DataRouterPy 文件转存器（监控目录 + 文件名拆分重组 + 按规则中转落位）"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pyinstaller>=6",
    "pillow>=10",
]

[project.scripts]
data-router = "datarouter.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
