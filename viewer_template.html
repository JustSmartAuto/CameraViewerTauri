<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cognex 3D RAW 点云查看器（离线单文件版）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1a2e;font-family:"Microsoft YaHei",Arial,sans-serif;color:#eee}
  #app{position:fixed;inset:0}
  #panel{position:fixed;top:10px;left:10px;width:330px;max-height:92vh;overflow:auto;
    background:rgba(15,15,30,.88);border:1px solid #444;border-radius:8px;padding:12px;font-size:12px;z-index:10}
  #panel h1{font-size:14px;margin:0 0 8px;color:#7fd4ff}
  #panel h2{font-size:12px;margin:10px 0 4px;color:#ffd479}
  #panel label{display:inline-block;width:76px;color:#aaa}
  #panel select,#panel input{width:150px;background:#222;color:#eee;border:1px solid #555;border-radius:3px;padding:2px}
  #panel .row{margin:3px 0}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,20,.75);z-index:20;font-size:18px;color:#9fdcff;pointer-events:none;opacity:0;transition:opacity .15s}
  #drop.on{opacity:1}
  #info{white-space:pre-wrap;background:#101020;border:1px solid #333;border-radius:4px;padding:6px;max-height:200px;overflow:auto}
  #status{color:#8f8;margin:6px 0}
  button{background:#2a5d8a;color:#fff;border:0;border-radius:4px;padding:4px 10px;cursor:pointer;margin-right:6px}
  button:hover{background:#3a7db0}
  #filebtn{margin-bottom:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="drop">松开以打开 RAW 文件</div>
<div id="panel">
  <h1>Cognex 3D RAW 点云查看器 v1.0</h1>
  <div class="row"><input type="file" id="filebtn" accept=".raw"></div>
  <div class="row">或将 .raw 文件直接拖入窗口</div>
  <h2>解码方式</h2>
  <div class="row"><label>模式</label>
    <select id="mode">
      <option value="auto">自动（推荐）</option>
      <option value="f32">float32 XYZ 三元组</option>
      <option value="fp1616">定点 16.16 扫描记录</option>
    </select></div>
  <div class="row"><label>起始偏移</label><input type="number" id="off" value="72" step="4"></div>
  <div class="row"><label>有效值上限</label><input type="number" id="vmax" value="100000" step="1000"></div>
  <div class="row"><label>最大点数</label><input type="number" id="maxpts" value="400000" step="50000"></div>
  <div class="row">
    <button id="apply">重新解析</button>
    <button id="top">俯视</button>
    <button id="reset">复位视角</button>
  </div>
  <div id="status">未加载文件</div>
  <h2>文件信息</h2>
  <div id="info">—</div>
  <h2>操作</h2>
  <div>左键旋转 / 右键平移 / 滚轮缩放</div>
</div>
<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>
(function(){
"use strict";
var MAGIC=0x50FACE11, HEADER=0x48, REC=0x3C00;
var scene,camera,renderer,controls,cloudPts=null,gridHelper,axesHelper;
var fileBuf=null, fileName="";

function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a1a2e);
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.01,1e8);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  gridHelper=new THREE.GridHelper(100,20,0x335533,0x224422);
  scene.add(gridHelper);
  axesHelper=new THREE.AxesHelper(50);
  scene.add(axesHelper);
  addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
  setView(true);
}
function setView(init){
  camera.position.set(80,-120,90);
  camera.up.set(0,0,1);
  controls.target.set(0,0,0);
  controls.update();
}
document.getElementById('reset').onclick=function(){setView();};
document.getElementById('top').onclick=function(){camera.position.set(0.01,0.01,200);controls.target.set(0,0,0);controls.update();};

/* ---------- RAW 解析 ---------- */
function u32(dv,o){return dv.getUint32(o,true);}
function parseInfo(buf){
  var dv=new DataView(buf);
  var out=[];
  var size=buf.byteLength;
  out.push("文件大小: "+size.toLocaleString()+" 字节");
  if(size<HEADER+4){out.push("文件过小");return {ok:false,text:out.join("\n")};}
  var magic=u32(dv,0), ver=u32(dv,4);
  out.push("魔数: 0x"+("0000000"+magic.toString(16)).slice(-8)+(magic===MAGIC?"  ✓":"  ✗ 非Cognex RAW"));
  out.push("版本: "+ver);
  if(magic!==MAGIC)return {ok:false,text:out.join("\n")};
  out.push("参数@0x31: 0x"+("0000000"+u32(dv,0x31).toString(16)).slice(-8));
  out.push("参数@0x3B: 0x"+("0000000"+u32(dv,0x3B).toString(16)).slice(-8));
  var pad=(size-HEADER)%4;
  out.push("数据区填充: "+pad+" 字节");
  // 尾部元数据签名
  var sig=new Uint8Array([0,0,0x80,0x3f,0,0,0xa0,0x40,0,0,0xa0,0x40]);
  var meta=findSig(new Uint8Array(buf),sig);
  out.push("元数据签名: "+(meta>=0?"0x"+meta.toString(16):"未找到"));
  var scanBytes=(meta>0?meta:size)-HEADER-pad;
  out.push("扫描记录估算: "+Math.floor(scanBytes/REC)+" 条 × "+REC+" B");
  return {ok:true,text:out.join("\n"),meta:meta};
}
function findSig(a,sig){
  outer:for(var i=a.length-sig.length;i>=Math.max(0,a.length-200000);i--){
    for(var j=0;j<sig.length;j++)if(a[i+j]!==sig[j])continue outer;
    return i;
  }
  return -1;
}

function extractPoints(buf,mode,off,vmax,maxPts){
  var dv=new DataView(buf);
  var n=Math.floor((buf.byteLength-off)/4);
  var pos=[],col=[];
  var minZ=1e300,maxZ=-1e300;
  var tmp=new Float32Array(maxPts*3);
  var cnt=0,stride=1;
  if(mode==="f32"){
    var nTri=Math.floor(n/3);
    stride=Math.max(1,Math.floor(nTri/maxPts));
    for(var i=0;i<nTri&&cnt<maxPts;i+=stride){
      var x=dv.getFloat32(off+i*12,true),
          y=dv.getFloat32(off+i*12+4,true),
          z=dv.getFloat32(off+i*12+8,true);
      if(!isFinite(x)||!isFinite(y)||!isFinite(z))continue;
      if(Math.abs(x)>vmax||Math.abs(y)>vmax||Math.abs(z)>vmax)continue;
      tmp[cnt*3]=x;tmp[cnt*3+1]=y;tmp[cnt*3+2]=z;cnt++;
    }
  }else{ // fp1616: u32/65536 连续三元组
    var m=Math.floor(n/3);
    stride=Math.max(1,Math.floor(m/maxPts));
    for(var k=0;k<m&&cnt<maxPts;k+=stride){
      var a=dv.getUint32(off+k*12,true)/65536,
          b=dv.getUint32(off+k*12+4,true)/65536,
          c=dv.getUint32(off+k*12+8,true)/65536;
      if(Math.abs(a)>vmax||Math.abs(b)>vmax||Math.abs(c)>vmax)continue;
      tmp[cnt*3]=a;tmp[cnt*3+1]=b;tmp[cnt*3+2]=c;cnt++;
    }
  }
  if(cnt===0)return null;
  var arr=new Float32Array(cnt*3);
  arr.set(tmp.subarray(0,cnt*3));
  for(var q=0;q<cnt;q++){var zz=arr[q*3+2];if(zz<minZ)minZ=zz;if(zz>maxZ)maxZ=zz;}
  return {positions:arr,count:cnt,minZ:minZ,maxZ:maxZ};
}

function show(buf){
  fileBuf=buf;
  var info=parseInfo(buf);
  document.getElementById('info').textContent=info.text;
  if(!info.ok){setStatus("解析失败：不是有效的 Cognex RAW 文件");return;}
  var mode=document.getElementById('mode').value;
  if(mode==="auto"){
    // 自动：先尝试 float32 三元组，点数过少则回退 16.16 定点
    var r=extractPoints(buf,"f32",HEADER,parseFloat(document.getElementById('vmax').value),parseInt(document.getElementById('maxpts').value));
    if(!r||r.count<500)r=extractPoints(buf,"fp1616",HEADER,1e6,parseInt(document.getElementById('maxpts').value));
    render(r,"自动模式");
  }else{
    var off=parseInt(document.getElementById('off').value)||HEADER;
    var vm=parseFloat(document.getElementById('vmax').value);
    render(extractPoints(buf,mode,off,vm,parseInt(document.getElementById('maxpts').value)),mode);
  }
}
function render(r,tag){
  if(cloudPts){scene.remove(cloudPts);cloudPts.geometry.dispose();cloudPts.material.dispose();cloudPts=null;}
  if(!r){setStatus("未提取到有效点（可调整偏移/上限后重新解析）");return;}
  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(r.positions,3));
  var colors=new Float32Array(r.count*3);
  var span=(r.maxZ-r.minZ)||1;
  for(var i=0;i<r.count;i++){
    var t=(r.positions[i*3+2]-r.minZ)/span;
    colors[i*3]=t; colors[i*3+1]=0.35; colors[i*3+2]=1-t; // 蓝->红 按高度
  }
  g.setAttribute('color',new THREE.BufferAttribute(colors,3));
  var m=new THREE.PointsMaterial({size:1.2,vertexColors:true,sizeAttenuation:true});
  cloudPts=new THREE.Points(g,m);
  scene.add(cloudPts);
  // 自动缩放
  g.computeBoundingSphere();
  var s=g.boundingSphere.radius||100;
  camera.near=Math.max(s/1000,0.01);camera.far=s*1000;
  camera.updateProjectionMatrix();
  controls.target.copy(g.boundingSphere.center);
  camera.position.set(g.boundingSphere.center.x+s*1.2,g.boundingSphere.center.y-s*1.5,g.boundingSphere.center.z+s);
  controls.update();
  // 网格随尺度调整
  scene.remove(gridHelper);scene.remove(axesHelper);
  gridHelper=new THREE.GridHelper(s*4,20,0x335533,0x224422);scene.add(gridHelper);
  axesHelper=new THREE.AxesHelper(s*1.5);scene.add(axesHelper);
  setStatus(tag+"：渲染 "+r.count.toLocaleString()+" 点，z∈["+r.minZ.toFixed(3)+", "+r.maxZ.toFixed(3)+"]");
}
function setStatus(t){document.getElementById('status').textContent=t;}

/* ---------- 拖放 ---------- */
function loadFile(f){
  fileName=f.name;
  var rd=new FileReader();
  rd.onload=function(e){setStatus("已加载 "+fileName);show(e.target.result);};
  rd.readAsArrayBuffer(f);
}
var dropEl=document.getElementById('drop');
addEventListener('dragenter',function(e){e.preventDefault();dropEl.className='on';});
addEventListener('dragover',function(e){e.preventDefault();dropEl.className='on';});
addEventListener('dragleave',function(e){if(e.relatedTarget===null)dropEl.className='';});
addEventListener('drop',function(e){e.preventDefault();dropEl.className='';if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0]);});
document.getElementById('filebtn').onchange=function(e){if(e.target.files.length)loadFile(e.target.files[0]);};
document.getElementById('apply').onclick=function(){if(fileBuf)show(fileBuf);};

init();
})();
</script>
</body>
</html>
