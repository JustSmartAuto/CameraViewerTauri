<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Cognex 3D 点云查看器（离线单文件版）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1a2e;font-family:"Microsoft YaHei",Arial,sans-serif;color:#eee}
  #app{position:fixed;inset:0}
  #panel{position:fixed;top:10px;left:10px;width:340px;max-height:94vh;overflow:auto;
    background:rgba(15,15,30,.88);border:1px solid #444;border-radius:8px;padding:12px;font-size:12px;z-index:10}
  #panel h1{font-size:14px;margin:0 0 8px;color:#7fd4ff}
  #panel h2{font-size:12px;margin:10px 0 4px;color:#ffd479}
  #panel label{display:inline-block;width:80px;color:#aaa}
  #panel select,#panel input[type=text],#panel input[type=number]{width:160px;background:#222;color:#eee;border:1px solid #555;border-radius:3px;padding:2px}
  #panel .row{margin:3px 0}
  #drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,20,.75);z-index:20;font-size:18px;color:#9fdcff;pointer-events:none;opacity:0;transition:opacity .15s}
  #drop.on{opacity:1}
  #info{white-space:pre-wrap;background:#101020;border:1px solid #333;border-radius:4px;padding:6px;max-height:200px;overflow:auto;font-family:Consolas,monospace;font-size:11px}
  #status{color:#8f8;margin:6px 0}
  button{background:#2a5d8a;color:#fff;border:0;border-radius:4px;padding:4px 10px;cursor:pointer;margin-right:6px;margin-bottom:4px;font-size:12px}
  button:hover{background:#3a7db0}
  button:disabled{background:#333;color:#666;cursor:not-allowed}
  button.primary{background:#4a8a3a}
  button.primary:hover{background:#5aaa4a}
  button.warn{background:#8a3a3a}
  button.warn:hover{background:#aa4a4a}
  .divider{border-top:1px solid #333;margin:8px 0}
  tag{display:inline-block;background:#224;color:#7fd4ff;padding:1px 5px;border-radius:3px;margin-left:4px;font-size:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="drop">松开以打开 .raw 或 .pcd 文件</div>
<div id="panel">
  <h1>Cognex 3D 点云查看器 v2.0</h1>
  <div class="row"><input type="file" id="filebtn" accept=".raw,.pcd"></div>
  <div class="row">或将 .raw / .pcd 文件拖入窗口</div>

  <h2>文件信息</h2>
  <div id="info">—</div>
  <div id="status">未加载文件</div>

  <h2>解码方式</h2>
  <div class="row"><label>模式</label>
    <select id="mode">
      <option value="auto">自动（推荐）</option>
      <option value="positions0">强制布局 B (_positions0)</option>
      <option value="tako">强制 Tako/WASM (仅 QuadMesh)</option>
      <option value="f32">float32 XYZ 三元组</option>
    </select></div>
  <div class="row"><label>起始偏移</label><input type="number" id="off" value="72" step="4"></div>
  <div class="row"><label>最大点数</label><input type="number" id="maxpts" value="2000000" step="100000"></div>
  <div class="row">
    <button id="apply">重新解析</button>
  </div>

  <div class="divider"></div>

  <h2>导出 PCD</h2>
  <div style="color:#aaa;font-size:11px;line-height:1.5">
    导出为 <strong>CloudCompare 兼容</strong> 的 PCD v0.7 二进制格式<br>
    FIELDS x y z / SIZE 4 4 4 / TYPE F F F
  </div>
  <div class="row">
    <button id="exportPcd" class="primary" disabled>下载 PCD (.pcd)</button>
  </div>

  <div class="divider"></div>

  <h2>视角</h2>
  <div class="row">
    <button id="top">俯视 (XY)</button>
    <button id="side">侧视 (XZ)</button>
    <button id="reset">复位</button>
  </div>

  <div class="divider"></div>

  <h2>操作</h2>
  <div>左键旋转 / 右键平移 / 滚轮缩放</div>
</div>
<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>/*__TAKO__*/</script>
<script>
(function(){
"use strict";

var MAGIC=0x50FACE11, HEADER=0x48, REC=0x3C00;
var scene,camera,renderer,controls,cloudPts=null,gridHelper,axesHelper;
var fileBuf=null, fileName="", fileInfo=null;
var takoViewer=null,takoScene=null,takoMesh=null,takoInitPromise=null,usingTako=false;
var CURRENT_POINTS=null; // {positions:Float32Array, count:int} 当前已解析点云，用于导出

/* ---------- 初始化 ---------- */
function init(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a1a2e);
  camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.01,1e8);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  gridHelper=new THREE.GridHelper(100,20,0x335533,0x224422);
  scene.add(gridHelper);
  axesHelper=new THREE.AxesHelper(50);
  scene.add(axesHelper);
  addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(takoViewer)takoViewer.resize(innerWidth,innerHeight);});
  (function loop(){requestAnimationFrame(loop);controls.update();if(!usingTako)renderer.render(scene,camera);})();
  setView();
}
function setView(which){
  if(usingTako&&takoScene){takoScene.fitView();return;}
  if(which==='top'){camera.position.set(0,-150,0.1);camera.up.set(0,0,1);}
  else if(which==='side'){camera.position.set(-150,0,0);camera.up.set(0,0,1);}
  else{camera.position.set(80,-120,90);camera.up.set(0,0,1);}
  controls.target.set(0,0,0);
  controls.update();
}
document.getElementById('reset').onclick=function(){setView();};
document.getElementById('top').onclick=function(){setView('top');};
document.getElementById('side').onclick=function(){setView('side');};

/* ---------- Tako/WASM ---------- */
function initTako(){
  if(!takoInitPromise){
    setStatus("初始化 Tako/WASM…");
    takoInitPromise=Tako({containerId:'app',fitToContainer:true}).then(function(viewer){
      takoViewer=viewer;takoScene=viewer.getScene();return viewer;
    });
  }
  return takoInitPromise;
}
function renderWithTako(buf){
  return initTako().then(function(){
    if(takoMesh){takoScene.deleteNode(takoMesh.nodeId);takoMesh.model.delete();takoMesh=null;}
    var model=new takoViewer.QuadMesh();
    model.importPacket(new Uint8Array(buf));
    var nodeId=takoScene.addNode(model);
    takoMesh={model:model,nodeId:nodeId};
    usingTako=true;renderer.domElement.style.display='none';
    takoViewer.canvas.style.display='block';takoScene.fitView();
    return model.isComplete();
  });
}

/* ---------- RAW 工具 ---------- */
function u32(dv,o){return dv.getUint32(o,true);}
function f32(dv,o){return dv.getFloat32(o,true);}
function findSig(a,sig){
  outer:for(var i=a.length-sig.length;i>=Math.max(0,a.length-200000);i--){
    for(var j=0;j<sig.length;j++)if(a[i+j]!==sig[j])continue outer;
    return i;
  }
  return -1;
}
function findBytes(buf,pat,maxScan){
  var a=new Uint8Array(buf),max=Math.min(maxScan||a.length,a.length);
  for(var i=0;i<max-pat.length;i++){
    var ok=true;for(var j=0;j<pat.length;j++)if(a[i+j]!==pat[j]){ok=false;break;}
    if(ok)return i;
  }
  return -1;
}

/* ---------- 布局 B: 从 _positions0 提取 ---------- */
function extractPositions0(buf,maxPts){
  var tag=_strToBytes('_positions0');
  var idx=findBytes(buf,tag);
  if(idx<0)return null;
  var tagEnd=idx+tag.length;
  // count: tag[-1] 处（因为 tag 后一个字节是 count 低字节）
  // 实际上 _positions0 后紧跟 4 字节 count，然后 9 字节 prefix 偏移被 count 覆盖
  // 所以 count 在 idx+tag.length-1 处（因为 prefix 的 9 字节 + tag 的 11 字节有重叠）
  var countOverlap=u32(new DataView(buf),idx+tag.length-1);
  var countAfter=u32(new DataView(buf),idx+tag.length);

  // 尝试 overlap 版本（CognexLogo 验证正确）
  var dataStart=idx+tag.length+3;
  var dataEnd=dataStart+countOverlap*12;
  if(dataEnd<=buf.byteLength&&countOverlap>100){
    var dv=new DataView(buf,dataStart,countOverlap*12);
    return _triplesFromDataView(dv,0,countOverlap,maxPts);
  }
  // 尝试 after 版本
  dataStart=idx+tag.length+4;
  dataEnd=dataStart+countAfter*12;
  if(dataEnd<=buf.byteLength&&countAfter>100){
    dv=new DataView(buf,dataStart,countAfter*12);
    return _triplesFromDataView(dv,0,countAfter,maxPts);
  }
  return null;
}

function _strToBytes(s){var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}

/* ---------- 通用 f32 三元组提取 ---------- */
function _triplesFromDataView(dv,off,nTri,maxPts){
  var stride=Math.max(1,Math.floor(nTri/maxPts))||1;
  var tmp=new Float32Array(Math.min(nTri,maxPts)*3);
  var cnt=0,minZ=1e300,maxZ=-1e300;
  for(var i=0;i<nTri&&cnt<maxPts;i+=stride){
    var x=dv.getFloat32(off+i*12,true),y=dv.getFloat32(off+i*12+4,true),z=dv.getFloat32(off+i*12+8,true);
    if(!isFinite(x)||!isFinite(y)||!isFinite(z))continue;
    if(Math.abs(x)>1e6||Math.abs(y)>1e6||Math.abs(z)>1e6)continue;
    tmp[cnt*3]=x;tmp[cnt*3+1]=y;tmp[cnt*3+2]=z;
    if(z<minZ)minZ=z;if(z>maxZ)maxZ=z;cnt++;
  }
  if(cnt===0)return null;
  var arr=new Float32Array(cnt*3);arr.set(tmp.subarray(0,cnt*3));
  return {positions:arr,count:cnt,minZ:minZ,maxZ:maxZ};
}

function extractF32(buf,off,maxPts){
  var nTri=Math.floor((buf.byteLength-off)/12);
  var dv=new DataView(buf);
  return _triplesFromDataView(dv,off,nTri,maxPts);
}

/* ---------- PCD 二进制解析 ---------- */
function parsePcd(buf,maxPts){
  var dv=new DataView(buf);
  // 找 "DATA binary"
  var marker=_strToBytes('DATA binary');
  var mIdx=findBytes(buf,marker);
  if(mIdx<0)return null;
  // 读 header 文本
  var hdrEnd=mIdx+marker.length;
  var hdrText='';
  for(var i=0;i<hdrEnd;i++){
    var b=dv.getUint8(i);
    if(b<0x20&&b!==0x0A&&b!==0x0D)break;
    hdrText+=String.fromCharCode(b);
  }
  var lines=hdrText.split(/[\r\n]+/);
  var info={fields:[],sizes:[],types:[],width:0,height:0,points:0,dataOff:hdrEnd};
  for(var i=0;i<lines.length;i++){
    var parts=lines[i].trim().split(/\s+/);
    if(parts[0]==='FIELDS')info.fields=parts.slice(1);
    else if(parts[0]==='SIZE')info.sizes=parts.slice(1).map(function(x){return parseInt(x);});
    else if(parts[0]==='TYPE')info.types=parts.slice(1);
    else if(parts[0]==='WIDTH')info.width=parseInt(parts[1]);
    else if(parts[0]==='HEIGHT')info.height=parseInt(parts[1]);
    else if(parts[0]==='POINTS')info.points=parseInt(parts[1]);
  }
  // 跳过 DATA binary 后的换行
  var p=hdrEnd;
  while(p<buf.byteLength){var b=dv.getUint8(p);if(b===0x0A||b===0x0D)p++;else break;}
  info.dataOff=p;
  // 只支持 FIELDS x y z / SIZE 4 / TYPE F
  var hasXYZ=info.fields.length>=3&&info.fields[0]==='x'&&info.fields[1]==='y'&&info.fields[2]==='z';
  if(!hasXYZ)return {header:info,error:'不支持的 PCD FIELDS: '+info.fields.join(' ')};
  var sizeOK=info.sizes.length>=3&&info.sizes[0]===4&&info.sizes[1]===4&&info.sizes[2]===4;
  var typeOK=info.types.length>=3&&info.types[0]==='F'&&info.types[1]==='F'&&info.types[2]==='F';
  if(!sizeOK||!typeOK)return {header:info,error:'只支持 SIZE 4 / TYPE F'};
  // 逐点提取
  var n=info.points;
  var stride=Math.max(1,Math.floor(n/maxPts))||1;
  var tmp=new Float32Array(Math.min(n,maxPts)*3);
  var cnt=0,minZ=1e300,maxZ=-1e300;
  for(var i=0;i<n&&cnt<maxPts;i+=stride){
    var x=dv.getFloat32(p+i*12,true),y=dv.getFloat32(p+i*12+4,true),z=dv.getFloat32(p+i*12+8,true);
    if(!isFinite(x)||!isFinite(y)||!isFinite(z))continue;
    tmp[cnt*3]=x;tmp[cnt*3+1]=y;tmp[cnt*3+2]=z;
    if(z<minZ)minZ=z;if(z>maxZ)maxZ=z;cnt++;
  }
  if(cnt===0)return {header:info,error:'PCD 中未找到有效点（可能全为 NaN）'};
  var arr=new Float32Array(cnt*3);arr.set(tmp.subarray(0,cnt*3));
  return {positions:arr,count:cnt,minZ:minZ,maxZ:maxZ,header:info};
}

/* ---------- 文件类型识别 ---------- */
function detectRawOrPcd(buf,fileName){
  // 先看扩展名
  var ext=fileName.split('.').pop().toLowerCase();
  if(ext==='pcd')return 'pcd';
  if(ext==='raw')return 'raw';
  // 从内容判断
  var u32_0=new DataView(buf).getUint32(0,true);
  if(u32_0===MAGIC)return 'raw';
  // 尝试 PCD "VERSION"
  var head=new Uint8Array(buf,0,Math.min(6,buf.byteLength));
  var s='';for(var i=0;i<head.length;i++)s+=String.fromCharCode(head[i]);
  if(s==='VERSIO')return 'pcd';
  return 'unknown';
}

function parseRawInfo(buf){
  var dv=new DataView(buf);
  var out=[];
  var size=buf.byteLength;
  out.push("文件类型: Cognex RAW v41");
  out.push("文件大小: "+size.toLocaleString()+" 字节 ("+(size/1048576).toFixed(2)+" MB)");
  var magic=u32(dv,0),ver=u32(dv,4);
  out.push("魔数: 0x"+("0000000"+magic.toString(16)).slice(-8)+(magic===MAGIC?" ✓":" ✗ 非Cognex RAW"));
  out.push("版本: "+ver);

  // 布局识别
  var tagP0=_strToBytes('_positions0');
  var idxP0=findBytes(buf,tagP0);
  var tagGrey=_strToBytes('_grey80');
  var idxGrey=findBytes(buf,tagGrey);
  var layoutB=(idxP0>=0);
  out.push("内部布局: "+(layoutB?'B (规则网格, _positions0)':'A (扫描记录, opaque)'));
  if(layoutB){
    var countOverlap=u32(dv,idxP0+tagP0.length-1);
    out.push("_positions0: 0x"+idxP0.toString(16)+", count="+countOverlap.toLocaleString());
  }else{
    // 找元数据签名
    var sig=new Uint8Array([0,0,0x80,0x3f,0,0,0xa0,0x40,0,0,0xa0,0x40]);
    var meta=findSig(new Uint8Array(buf),sig);
    out.push("元数据签名: "+(meta>=0?"0x"+meta.toString(16)+" → 扫描记录约 "+Math.floor((meta-HEADER)/REC)+" 条":"未找到"));
    out.push("提示: 布局 A 内部为 opaque 格式，浏览器端无法直接解码。请使用设备 SavePointCloud() 导出的 .pcd 文件查看。");
  }
  if(idxGrey>=0)out.push("_grey80: 0x"+idxGrey.toString(16));

  // 头部参数
  out.push("");
  out.push("头部参数 (0x00-0x4F):");
  out.push("  @0x10: u32=0x"+("0000000"+u32(dv,0x10).toString(16)).slice(-8)+" f32="+f32(dv,0x10).toFixed(6));
  out.push("  @0x14: u32=0x"+("0000000"+u32(dv,0x14).toString(16)).slice(-8));
  out.push("  @0x30: u32=0x"+("0000000"+u32(dv,0x30).toString(16)).slice(-8));
  out.push("  @0x40: f32="+f32(dv,0x40).toFixed(6));
  out.push("  @0x44: f32="+f32(dv,0x44).toFixed(6));

  return {ok:true,text:out.join("\n"),layout:layoutB?'B':'A'};
}

function parsePcdInfo(buf){
  var dv=new DataView(buf);
  var out=[];
  out.push("文件类型: PCD v0.7 (二进制)");
  out.push("文件大小: "+buf.byteLength.toLocaleString()+" 字节 ("+(buf.byteLength/1048576).toFixed(2)+" MB)");
  var res=parsePcd(buf,50);
  if(res.error){out.push("错误: "+res.error);return {ok:false,text:out.join("\n")};}
  var h=res.header;
  out.push("FIELDS: "+h.fields.join(' '));
  out.push("SIZE: "+h.sizes.join(' '));
  out.push("TYPE: "+h.types.join(' '));
  out.push("WIDTH: "+h.width);
  out.push("HEIGHT: "+h.height);
  out.push("POINTS: "+h.points.toLocaleString());
  out.push("DATA offset: 0x"+h.dataOff.toString(16));
  out.push("");
  out.push("载荷: "+(buf.byteLength-h.dataOff).toLocaleString()+" 字节");
  out.push("解析有效点: "+res.count.toLocaleString());
  out.push("z 范围: ["+res.minZ.toFixed(4)+", "+res.maxZ.toFixed(4)+"]");
  return {ok:true,text:out.join("\n")};
}

/* ---------- 主 show 流程 ---------- */
function show(buf){
  fileBuf=buf;
  var fileType=detectRawOrPcd(buf,fileName);
  var infoBox=document.getElementById('info');
  var maxPts=parseInt(document.getElementById('maxpts').value)||2000000;

  if(fileType==='pcd'){
    fileInfo=parsePcdInfo(buf);
    infoBox.textContent=fileInfo.text;
    if(!fileInfo.ok){setStatus("PCD 解析失败");return Promise.resolve();}
    var res=parsePcd(buf,maxPts);
    if(res.error){setStatus("PCD 错误: "+res.error);return Promise.resolve();}
    render(res,"PCD 直接加载");
    return Promise.resolve();
  }

  if(fileType==='raw'){
    fileInfo=parseRawInfo(buf);
    infoBox.textContent=fileInfo.text;
    var mode=document.getElementById('mode').value;

    // 自动模式
    if(mode==='auto'){
      // 先试布局 B
      var r=extractPositions0(buf,maxPts);
      if(r){render(r,"RAW 布局 B (_positions0 直取)");return Promise.resolve();}
      // 再试 Tako
      setStatus("尝试 Tako/WASM…");
      return renderWithTako(buf).then(function(complete){
        setStatus("Tako/WASM: "+(complete?"完成":"数据包不完整"));
      }).catch(function(err){
        usingTako=false;renderer.domElement.style.display='block';
        if(takoViewer)takoViewer.canvas.style.display='none';
        setStatus("⚠ 布局 A 内部为 opaque 格式，浏览器无法直接解码。请加载 .pcd 文件。");
        document.getElementById('exportPcd').disabled=true;
      });
    }
    // 强制布局 B
    if(mode==='positions0'){
      r=extractPositions0(buf,maxPts);
      if(r)render(r,"强制布局 B");
      else setStatus("未找到 _positions0 标签，此文件不是布局 B");
      return Promise.resolve();
    }
    // 强制 Tako
    if(mode==='tako'){
      return renderWithTako(buf).then(function(){
        setStatus("Tako/WASM: 完成（但无法导出 PCD，只能内嵌查看）");
      }).catch(function(err){
        usingTako=false;renderer.domElement.style.display='block';
        setStatus("Tako/WASM 不支持此 RAW 容器。请选择自动模式或加载 .pcd");
      });
    }
    // float32 三元组
    var off=parseInt(document.getElementById('off').value);
    r=extractF32(buf,off,maxPts);
    render(r,"float32 三元组 (偏移 "+off+")");
    return Promise.resolve();
  }

  setStatus("无法识别的文件类型");
  return Promise.resolve();
}

function render(r,tag){
  if(cloudPts){scene.remove(cloudPts);cloudPts.geometry.dispose();cloudPts.material.dispose();cloudPts=null;}
  if(takoMesh){takoScene.deleteNode(takoMesh.nodeId);takoMesh.model.delete();takoMesh=null;}
  usingTako=false;renderer.domElement.style.display='block';
  if(takoViewer)takoViewer.canvas.style.display='none';

  if(!r||!r.count){setStatus("未提取到有效点");document.getElementById('exportPcd').disabled=true;CURRENT_POINTS=null;return;}

  CURRENT_POINTS={positions:r.positions.slice(),count:r.count};
  document.getElementById('exportPcd').disabled=false;

  var g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(r.positions,3));
  var colors=new Float32Array(r.count*3);
  var span=(r.maxZ-r.minZ)||1;
  for(var i=0;i<r.count;i++){
    var t=(r.positions[i*3+2]-r.minZ)/span;
    colors[i*3]=t; colors[i*3+1]=0.35; colors[i*3+2]=1-t; // 蓝->红 按高度
  }
  g.setAttribute('color',new THREE.BufferAttribute(colors,3));
  var m=new THREE.PointsMaterial({size:2,vertexColors:true,sizeAttenuation:false});
  cloudPts=new THREE.Points(g,m);
  scene.add(cloudPts);

  g.computeBoundingSphere();
  var s=g.boundingSphere.radius||100;
  camera.near=Math.max(s/1000,0.01);camera.far=s*1000;
  camera.updateProjectionMatrix();
  controls.target.copy(g.boundingSphere.center);
  camera.position.set(g.boundingSphere.center.x+s*1.2,g.boundingSphere.center.y-s*1.5,g.boundingSphere.center.z+s);
  controls.update();
  scene.remove(gridHelper);scene.remove(axesHelper);
  gridHelper=new THREE.GridHelper(s*4,20,0x335533,0x224422);scene.add(gridHelper);
  axesHelper=new THREE.AxesHelper(s*1.5);scene.add(axesHelper);

  setStatus(tag+"：渲染 "+r.count.toLocaleString()+" 点，z∈["+r.minZ.toFixed(4)+", "+r.maxZ.toFixed(4)+"]");
}

/* ---------- PCD 导出 ---------- */
function exportPcd(){
  if(!CURRENT_POINTS)return;
  var n=CURRENT_POINTS.count;
  var arr=CURRENT_POINTS.positions;
  // 构造 header（用 actual 点数，用 HEIGHT=1 表示无序点云 —— CloudCompare 可正确处理）
  // 但为了保留原始宽度，尝试从 fileInfo 提取
  var w=1,h=n;
  if(fileInfo&&fileInfo.header){
    w=fileInfo.header.width||1;
    h=fileInfo.header.height||1;
    if(w*h===n){/* 使用原始宽高*/}
    else{w=1;h=n;}
  }
  var hdr="VERSION 0.7\nFIELDS x y z\nSIZE 4 4 4\nTYPE F F F\nDIMENSIONS 3\nWIDTH "+w+"\nHEIGHT "+h+"\nVIEWPOINT 0 0 0 1 0 0 0\nPOINTS "+n+"\nDATA binary\n";
  var hdrBytes=new TextEncoder().encode(hdr);
  var pos=0;
  var buf=new Uint8Array(hdrBytes.length+n*12);
  buf.set(hdrBytes,0);pos=hdrBytes.length;
  var dv=new DataView(buf.buffer);
  for(var i=0;i<n;i++){
    dv.setFloat32(pos+i*12,  arr[i*3],  true);
    dv.setFloat32(pos+i*12+4,arr[i*3+1],true);
    dv.setFloat32(pos+i*12+8,arr[i*3+2],true);
  }
  var blob=new Blob([buf],{type:'application/octet-stream'});
  var a=document.createElement('a');
  var base=fileName.replace(/\.(raw|pcd)$/i,'');
  a.href=URL.createObjectURL(blob);
  a.download=(base||'pointcloud')+'.pcd';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("✓ 已导出 "+n.toLocaleString()+" 点 → "+(base||'pointcloud')+".pcd");
}

function setStatus(t){document.getElementById('status').textContent=t;}

/* ---------- 拖放 & 事件 ---------- */
function loadFile(f){
  fileName=f.name;
  var rd=new FileReader();
  rd.onload=function(e){setStatus("已加载 "+fileName);show(e.target.result);};
  rd.readAsArrayBuffer(f);
}
var dropEl=document.getElementById('drop');
addEventListener('dragenter',function(e){e.preventDefault();dropEl.className='on';});
addEventListener('dragover',function(e){e.preventDefault();dropEl.className='on';});
addEventListener('dragleave',function(e){if(e.relatedTarget===null)dropEl.className='';});
addEventListener('drop',function(e){e.preventDefault();dropEl.className='';if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0]);});
document.getElementById('filebtn').onchange=function(e){if(e.target.files.length)loadFile(e.target.files[0]);};
document.getElementById('apply').onclick=function(){if(fileBuf)show(fileBuf);};
document.getElementById('exportPcd').onclick=exportPcd;

init();
})();
</script>
