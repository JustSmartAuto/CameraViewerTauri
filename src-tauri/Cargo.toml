[package]
name = "camera-viewer-tauri"
version = "26.9.20"
description = "CameraViewerTauri"
authors = ["you"]
edition = "2021"

[lib]
name = "camera_viewer_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
chrono = "0.4"
notify = "6"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
imgref = "1.11"
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
unftp-core = "0.1"
async-trait = "0.1"
suppaftp = { version = "6", features = ["native-tls"] }
elevated-command = "1.1.3"
winreg = "0.52"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
encoding_rs = "0.8"
log = "0.4"
# 纯 Rust 实现的 ECMAScript 引擎，用于图片清理高级版的脚本沙箱
# 原 qjs_runtime (Lewin671/quickjs-rust) 因 GitHub 网络不可达，改用 crates.io 上的 boa_engine
boa_engine = { version = "0.22", default-features = false, features = ["float16", "xsum", "temporal"] }

[profile.release]
opt-level = 3
lto = true
strip = true
